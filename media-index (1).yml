name: Update media archive

on:
  push:
    branches: [main, master]
    paths:
      - "media/**"
      - "scripts/generate_media_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index-media:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate media index
        run: python scripts/generate_media_index.py
      - name: Commit updated media index
        run: |
          if git diff --quiet -- media-index.json; then
            echo "Media index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-index.json
          git commit -m "Update media archive"
          git push
